[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -v -s --tb=short --alluredir=allure-results --html=reports/report.html --self-contained-html
log_level = INFO
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
filterwarnings =
    ignore::DeprecationWarning
markers =
    login: Tests for the login screen (valid / locked / problem / glitch users)
    inventory: Tests for the inventory listing and sorting
    cart: Tests for the shopping cart (add / remove / badge count)
    checkout: End-to-end checkout flow tests
